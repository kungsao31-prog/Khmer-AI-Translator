<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SK ProKH — Video Translate & Dub Studio (Gemini API)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Kantumruy Pro', sans-serif;
      background: #090714;
      color: #f8fafc;
    }
    .glass {
      background: rgba(20, 16, 40, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    @keyframes animPop {
      0% { transform: scale(0.75); opacity: 0.2; }
      70% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes animBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    @keyframes animFade {
      0% { opacity: 0.15; }
      100% { opacity: 1; }
    }
    @keyframes animSlide {
      0% { transform: translateX(-28px); opacity: 0.2; }
      100% { transform: translateX(0); opacity: 1; }
    }
    .sub-pop { animation: animPop 0.9s ease infinite; }
    .sub-bounce { animation: animBounce 1.1s ease-in-out infinite; }
    .sub-fade { animation: animFade 1.4s ease-in-out infinite alternate; }
    .sub-slide { animation: animSlide 1s ease infinite; }
  </style>
</head>
<body class="min-h-screen pb-14">

  <!-- Top Header -->
  <header class="sticky top-0 z-30 glass border-b border-white/10 px-4 py-3">
    <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-pink-500 via-purple-500 to-cyan-400 flex items-center justify-center font-bold text-slate-950 shadow-lg">
          SK
        </div>
        <div>
          <h1 class="font-bold text-base sm:text-lg tracking-wide text-white">SK ProKH Studio</h1>
          <p class="text-xs text-slate-400">Gemini AI Translate • Subtitle • Dub ភាគ • ទាញ Link • ដាក់ Logo/Blur</p>
        </div>
      </div>

      <!-- Main Mode Tabs -->
      <nav class="flex flex-wrap gap-1.5 bg-slate-900/90 p-1 rounded-xl border border-white/10" id="mainTabs">
        <button data-tab="subtitle" class="tab-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold bg-gradient-to-r from-pink-500 to-purple-600 text-white">
          ១. បកប្រែ & Subtitle
        </button>
        <button data-tab="dub" class="tab-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold text-slate-300 hover:bg-white/5">
          ២. Dub / Anime ភាគ
        </button>
        <button data-tab="downloader" class="tab-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold text-slate-300 hover:bg-white/5">
          ៣. ទាញ Link
        </button>
        <button data-tab="poster" class="tab-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold text-slate-300 hover:bg-white/5">
          ៤. Poster & Export
        </button>
      </nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 pt-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- Left Column: Live Video & Subtitle / Dub Preview Stage -->
    <section class="lg:col-span-5 flex flex-col items-center">
      <div class="w-full max-w-[340px] glass rounded-3xl p-3 shadow-2xl border border-purple-500/20">
        <div class="flex items-center justify-between text-xs text-slate-400 px-2 pb-2">
          <span id="previewBadge" class="px-2 py-0.5 rounded-full bg-purple-500/20 text-purple-300 font-semibold">9:16 Vertical</span>
          <span id="previewResLabel">1080p Full HD</span>
        </div>

        <!-- 9:16 Video Stage -->
        <div id="videoStage" class="relative aspect-[9/16] w-full rounded-2xl overflow-hidden bg-gradient-to-b from-indigo-950 via-slate-900 to-black flex flex-col justify-between p-4 border border-white/10">
          <img id="stageBgImage" src="" alt="" class="hidden absolute inset-0 w-full h-full object-cover opacity-65" />

          <!-- Blur Overlay Zone -->
          <div id="blurZone" class="hidden absolute top-3 right-3 w-24 h-8 rounded-lg backdrop-blur-md bg-white/15 border border-white/20 flex items-center justify-center text-[10px] text-white/80 z-10">
            BLUR ZONE
          </div>

          <!-- Top Logo / Watermark -->
          <div id="logoOverlay" class="relative z-20 flex items-center justify-between">
            <span id="logoText" class="px-2.5 py-1 rounded-md bg-black/55 border border-white/15 text-xs font-bold text-amber-300">
              SK ProKH
            </span>
            <span id="epIndicator" class="px-2 py-0.5 rounded-md bg-pink-500/80 text-[11px] font-bold text-white">
              ភាគទី ១
            </span>
          </div>

          <!-- Center Upload / Play Prompt -->
          <div class="relative z-20 text-center my-auto px-2">
            <label class="cursor-pointer inline-flex flex-col items-center gap-2 p-4 rounded-2xl bg-black/45 hover:bg-black/65 border border-dashed border-white/25 transition">
              <span class="text-2xl">🎬</span>
              <span id="videoFileName" class="text-xs font-semibold text-slate-200">ចុចដើម្បីជ្រើសរើសវីដេអូ (.mp4)</span>
              <input type="file" id="videoInput" accept="video/*" class="hidden" />
            </label>
          </div>

          <!-- Subtitle Box -->
          <div class="relative z-20 w-full text-center">
            <div id="subtitlePreview" class="sub-pop inline-block max-w-full px-3 py-1.5 rounded-lg font-bold leading-snug transition-all" style="font-size: 18px; color: #ffffff; background: rgba(0,0,0,0.65);">
              សួស្តី! នេះជាអក្សររត់បកប្រែភាសាខ្មែរ
            </div>
            <div class="mt-2 flex items-center justify-between text-[10px] text-slate-300 bg-black/50 px-2.5 py-1 rounded-full">
              <span id="animNameLabel">Anim: POP</span>
              <span id="opacityLabel">BG: 65%</span>
            </div>
          </div>
        </div>

        <!-- Quick Action Buttons under Preview -->
        <div class="grid grid-cols-2 gap-2 mt-3">
          <button onclick="exportSrtFile()" class="py-2 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold border border-white/10">
            ទាញយក .SRT
          </button>
          <button onclick="exportProjectJson()" class="py-2 px-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:opacity-95 text-xs font-bold text-slate-950">
            រក្សាទុក Project (.JSON)
          </button>
        </div>
      </div>
    </section>

    <!-- Right Column: Feature Controls -->
    <section class="lg:col-span-7 space-y-5">

      <!-- TAB 1: SUBTITLE & TRANSLATE -->
      <div id="panel-subtitle" class="tab-panel glass rounded-2xl p-5 space-y-4">
        <div class="flex items-center justify-between border-b border-white/10 pb-3">
          <h2 class="font-bold text-base text-pink-300">កំណត់ការបកប្រែ (Gemini API) និងរចនាបថ Subtitle</h2>
          <span class="text-xs text-slate-400">Pop • Bounce • Fade • Slide • Karaoke</span>
        </div>

        <!-- Gemini API Config Box -->
        <div class="p-3.5 rounded-2xl bg-slate-900/95 border border-cyan-500/25 space-y-2.5">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-cyan-300">🔑 Gemini API Key & Model</span>
            <span id="apiStatusBadge" class="text-[11px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">មិនទាន់បញ្ចូល Key</span>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
            <input id="geminiApiKey" type="password" placeholder="បញ្ចូល Gemini API Key (AIza...)" class="sm:col-span-2 bg-slate-950 border border-white/15 rounded-xl px-3 py-2 text-xs text-white" />
            <select id="geminiModel" class="bg-slate-950 border border-white/15 rounded-xl px-2.5 py-2 text-xs text-white">
              <option value="gemini-3.8-flash" selected>gemini-3.8-flash</option>
              <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite</option>
            </select>
          </div>
          <p class="text-[11px] text-slate-400">
            Key ត្រូវបានរក្សាទុកក្នុង Browser (localStorage) របស់អ្នកតែប៉ុណ្ណោះ។
          </p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-300 mb-1">ភាសាដើម (Source)</label>
            <select id="srcLang" class="w-full bg-slate-900 border border-white/15 rounded-xl px-3 py-2 text-sm">
              <option value="zh">ចិន (Chinese / Douyin)</option>
              <option value="en">អង់គ្លេស (English)</option>
              <option value="th">ថៃ (Thai)</option>
              <option value="vi">វៀតណាម (Vietnamese)</option>
              <option value="ko">កូរ៉េ (Korean)</option>
              <option value="ja">ជប៉ុន (Japanese)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-300 mb-1">បកប្រែទៅជា</label>
            <select id="dstLang" class="w-full bg-slate-900 border border-white/15 rounded-xl px-3 py-2 text-sm">
              <option value="ខ្មែរ" selected>ខ្មែរ (Khmer)</option>
              <option value="អង់គ្លេស">អង់គ្លេស (English)</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs text-slate-300 mb-1">អត្ថបទដើម ឬបន្ទាត់ Subtitle (មួយបន្ទាត់ = មួយឃ្លា)</label>
          <textarea id="rawLinesInput" rows="4" class="w-full bg-slate-900 border border-white/15 rounded-xl p-3 text-sm" placeholder="បញ្ចូលអត្ថបទដើម...">你好，欢迎来到今天的故事
我们一起看看发生了什么
太精彩了，千万别错过</textarea>
          <div class="flex flex-wrap gap-2 mt-2">
            <button id="btnTranslateGemini" onclick="translateWithGemini()" class="px-4 py-1.5 rounded-xl bg-gradient-to-r from-pink-500 to-purple-600 hover:opacity-95 text-xs font-bold text-white shadow">
              ✨ បកប្រែដោយ Gemini API
            </button>
            <button onclick="generateSampleKhmerSubs()" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold border border-white/10">
              សាកល្បងគំរូ (ក្រៅបណ្តាញ)
            </button>
            <button onclick="toggleBlur()" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold border border-white/10">
              បិទ/បើក Blur លាក់ Logo
            </button>
          </div>
          <p id="translateErrorMsg" class="text-xs text-rose-400 mt-1.5"></p>
        </div>

        <!-- Animation & Color -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-1">
          <div>
            <label class="block text-xs text-slate-300 mb-1.5">ចលនាអក្សរ (Animation)</label>
            <div class="grid grid-cols-3 gap-1.5" id="animButtons">
              <button data-anim="pop" class="anim-chip py-1.5 rounded-lg text-xs font-semibold bg-pink-500 text-white">Pop</button>
              <button data-anim="bounce" class="anim-chip py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300">Bounce</button>
              <button data-anim="fade" class="anim-chip py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300">Fade</button>
              <button data-anim="slide" class="anim-chip py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300">Slide</button>
              <button data-anim="karaoke" class="anim-chip col-span-2 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300">Karaoke Highlight</button>
            </div>
          </div>

          <div class="space-y-2.5">
            <div>
              <div class="flex justify-between text-xs text-slate-300 mb-1">
                <span>ទំហំអក្សរ (Font Size)</span>
                <span id="fontSizeVal">18px</span>
              </div>
              <input id="fontSizeRange" type="range" min="14" max="30" value="18" class="w-full accent-pink-500" />
            </div>
            <div>
              <div class="flex justify-between text-xs text-slate-300 mb-1">
                <span>ស្រមោលផ្ទៃអក្សរ (BG Opacity)</span>
                <span id="bgOpacityVal">65%</span>
              </div>
              <input id="bgOpacityRange" type="range" min="0" max="100" value="65" class="w-full accent-cyan-400" />
            </div>
          </div>
        </div>

        <!-- Editable Subtitle Segments List -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-bold text-slate-300">បញ្ជីឃ្លា Subtitle (ចុចលើឃ្លាដើម្បីកែ និងមើល Preview)</span>
            <span id="segCount" class="text-xs text-cyan-300">3 ឃ្លា</span>
          </div>
          <div id="subtitleList" class="space-y-2 max-h-52 overflow-y-auto pr-1"></div>
        </div>
      </div>

      <!-- TAB 2: DUB / ANIME EPISODES -->
      <div id="panel-dub" class="tab-panel hidden glass rounded-2xl p-5 space-y-4">
        <div class="flex items-center justify-between border-b border-white/10 pb-3">
          <h2 class="font-bold text-base text-amber-300">គ្រប់គ្រងភាគ Dub / Anime (១ ដល់ ១០ ភាគ)</h2>
          <button onclick="addEpisode()" class="px-3 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-xs font-bold text-slate-950">
            + បន្ថែមភាគថ្មី
          </button>
        </div>
        <div id="episodeList" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
      </div>

      <!-- TAB 3: LINK DOWNLOADER QUEUE -->
      <div id="panel-downloader" class="tab-panel hidden glass rounded-2xl p-5 space-y-4">
        <div class="border-b border-white/10 pb-3">
          <h2 class="font-bold text-base text-cyan-300">បញ្ជី Link វីដេអូ (TikTok • Douyin • Kuaishou • IG • X • Pinterest)</h2>
          <p class="text-xs text-slate-400 mt-1">រៀបចំ Link និងជម្រើស HD គ្មាន Watermark ឬ Dub សំឡេង</p>
        </div>

        <div class="flex flex-col sm:flex-row gap-2">
          <input id="linkInput" type="text" placeholder="បិទភ្ជាប់ Link វីដេអូ (TikTok / Douyin / Kuaishou / IG / X / Pinterest)..." class="flex-1 bg-slate-900 border border-white/15 rounded-xl px-3 py-2 text-sm" />
          <button onclick="addLinkJob()" class="px-4 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-sm font-bold text-slate-950">
            + បញ្ចូលជួរ
          </button>
        </div>

        <div class="flex flex-wrap gap-4 text-xs text-slate-200">
          <label class="flex items-center gap-2 cursor-pointer">
            <input id="optNoWatermark" type="checkbox" checked class="accent-cyan-400" />
            <span>HD គ្មាន Watermark</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input id="optDubAudio" type="checkbox" class="accent-pink-500" />
            <span>Dub សំឡេងខ្មែររួមជាមួយ</span>
          </label>
        </div>

        <div id="linkQueueList" class="space-y-2"></div>
      </div>

      <!-- TAB 4: POSTER & EXPORT -->
      <div id="panel-poster" class="tab-panel hidden glass rounded-2xl p-5 space-y-4">
        <div class="border-b border-white/10 pb-3">
          <h2 class="font-bold text-base text-emerald-300">រូប Poster • គុណភាព Export • Logo</h2>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs text-slate-300 mb-1">ជ្រើសរើសរូប Poster / Cover</label>
            <input id="posterInput" type="file" accept="image/*" class="w-full text-xs text-slate-300 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:bg-emerald-500 file:text-slate-950 file:font-bold" />
          </div>
          <div>
            <label class="block text-xs text-slate-300 mb-1">អក្សរ Logo / Brand</label>
            <input id="brandNameInput" type="text" value="SK ProKH" class="w-full bg-slate-900 border border-white/15 rounded-xl px-3 py-2 text-sm" />
          </div>
        </div>

        <div>
          <label class="block text-xs text-slate-300 mb-1.5">កម្រិតគុណភាព Export (Resolution)</label>
          <div class="grid grid-cols-3 gap-2" id="resButtons">
            <button data-res="540p" class="res-btn py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300">540p</button>
            <button data-res="720p" class="res-btn py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300">720p HD</button>
            <button data-res="1080p Full HD" class="res-btn py-2 rounded-xl text-xs font-bold bg-emerald-500 text-slate-950">1080p Full HD</button>
          </div>
        </div>

        <div class="p-4 rounded-2xl bg-slate-900/90 border border-white/10 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <div class="text-xs text-slate-400">ស្ថានភាពកញ្ចប់ Export</div>
            <div id="exportSummary" class="text-sm font-bold text-white mt-0.5">1080p Full HD • Subtitle + Logo</div>
          </div>
          <button onclick="triggerExportCheck()" class="px-4 py-2.5 rounded-xl bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-400 text-xs font-extrabold text-slate-950 shadow-lg">
            ត្រៀម Export វីដេអូ
          </button>
        </div>
        <p id="exportStatusMsg" class="text-xs text-cyan-300"></p>
      </div>

    </section>
  </main>

  <script>
    const STORAGE_KEY = 'SK_PROKH_GEMINI_KEY';

    const state = {
      animation: 'pop',
      fontSize: 18,
      bgOpacity: 65,
      resolution: '1080p Full HD',
      blurEnabled: false,
      activeEp: 1,
      subtitles: [
        { start: '00:00:01,000', end: '00:00:04,200', km: 'សួស្តី! ស្វាគមន៍មកកាន់រឿងថ្ងៃនេះ' },
        { start: '00:00:04,300', end: '00:00:07,800', km: 'តោះយើងមើលរួមគ្នា ថាតើមានអ្វីកើតឡើង' },
        { start: '00:00:08,000', end: '00:00:11,500', km: 'ពិតជាអស្ចារ្យណាស់ កុំភ្លេចតាមដានបន្ត!' }
      ],
      episodes: [
        { ep: 1, title: 'ភាគទី ១ — ចាប់ផ្តើមដំណើរ', voice: 'សំឡេងប្រុសច្បាស់ (Khmer)', status: 'រួចរាល់' },
        { ep: 2, title: 'ភាគទី ២ — ការប្រឈមមុខ', voice: 'សំឡេងស្រីស្រទន់ (Khmer)', status: 'រង់ចាំ Dub' },
        { ep: 3, title: 'ភាគទី ៣ — អាថ៌កំបាំងថ្មី', voice: 'សំឡេងប្រុសច្បាស់ (Khmer)', status: 'រង់ចាំ Dub' }
      ],
      links: [
        { url: 'https://www.douyin.com/video/sample-01', platform: 'Douyin', noWm: true, dub: true }
      ]
    };

    // Load saved API key
    const apiKeyInput = document.getElementById('geminiApiKey');
    const savedKey = localStorage.getItem(STORAGE_KEY) || '';
    apiKeyInput.value = savedKey;
    updateApiStatusBadge();

    apiKeyInput.addEventListener('input', () => {
      localStorage.setItem(STORAGE_KEY, apiKeyInput.value.trim());
      updateApiStatusBadge();
    });

    function updateApiStatusBadge() {
      const badge = document.getElementById('apiStatusBadge');
      if (apiKeyInput.value.trim()) {
        badge.textContent = 'បានភ្ជាប់ Key រួចរាល់';
        badge.className = 'text-[11px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 font-semibold';
      } else {
        badge.textContent = 'មិនទាន់បញ្ចូល Key';
        badge.className = 'text-[11px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-300';
      }
    }

    // Gemini Translation Function
    async function translateWithGemini() {
      const errEl = document.getElementById('translateErrorMsg');
      const btn = document.getElementById('btnTranslateGemini');
      errEl.textContent = '';

      const apiKey = apiKeyInput.value.trim();
      const model = document.getElementById('geminiModel').value;
      const targetLang = document.getElementById('dstLang').value;
      const lines = document.getElementById('rawLinesInput').value
        .split('\n')
        .map(l => l.trim())
        .filter(Boolean);

      if (!apiKey) {
        errEl.textContent = 'សូមបញ្ចូល Gemini API Key ជាមុនសិន។';
        return;
      }
      if (!lines.length) {
        errEl.textContent = 'សូមបញ្ចូលអត្ថបទដើមយ៉ាងហោចណាស់ ១ បន្ទាត់។';
        return;
      }

      btn.disabled = true;
      const originalBtnText = btn.textContent;
      btn.textContent = '⏳ កំពុងបកប្រែជាមួយ Gemini...';

      const prompt = [
        `Translate each numbered line below into natural, expressive ${targetLang} suitable for video subtitles/dubbing.`,
        `Return ONLY a valid JSON array of strings with the exact same number of items (${lines.length}). Do not add markdown fences or extra explanation.`,
        JSON.stringify(lines)
      ].join('\n\n');

      try {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: {
              temperature: 0.4,
              responseMimeType: 'application/json'
            }
          })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data?.error?.message || `HTTP ${response.status}`);
        }

        const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || '[]';
        const cleaned = rawText.replace(/^```json\s*/i, '').replace(/```$/i, '').trim();
        let translatedArr;

        try {
          translatedArr = JSON.parse(cleaned);
        } catch {
          translatedArr = cleaned.split('\n').map(s => s.trim()).filter(Boolean);
        }

        if (!Array.isArray(translatedArr) || !translatedArr.length) {
          throw new Error('ទទួលបានលទ្ធផលបកប្រែមិនត្រឹមត្រូវពី Gemini។');
        }

        state.subtitles = lines.map((_, idx) => {
          const s = idx * 3 + 1;
          const e = s + 2.8;
          return {
            start: `00:00:${String(s).padStart(2, '0')},000`,
            end: `00:00:${String(Math.floor(e)).padStart(2, '0')},500`,
            km: String(translatedArr[idx] ?? translatedArr[translatedArr.length - 1] ?? '')
          };
        });

        renderSubtitles();
        document.getElementById('subtitlePreview').textContent = state.subtitles[0].km;
        applySubtitleStyle();
      } catch (err) {
        errEl.textContent = 'បរាជ័យក្នុងការបកប្រែ៖ ' + (err?.message || err);
      } finally {
        btn.disabled = false;
        btn.textContent = originalBtnText;
      }
    }

    // Main Tabs
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => {
          b.className = 'tab-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold text-slate-300 hover:bg-white/5';
        });
        btn.className = 'tab-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold bg-gradient-to-r from-pink-500 to-purple-600 text-white';
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
        document.getElementById('panel-' + btn.dataset.tab).classList.remove('hidden');
      });
    });

    // Video File Selection
    document.getElementById('videoInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      document.getElementById('videoFileName').textContent = file.name;
      const existingVid = document.getElementById('previewVideoEl');
      if (existingVid) existingVid.remove();
      const vid = document.createElement('video');
      vid.id = 'previewVideoEl';
      vid.src = URL.createObjectURL(file);
      vid.controls = true;
      vid.className = 'absolute inset-0 w-full h-full object-cover z-0';
      document.getElementById('videoStage').prepend(vid);
    });

    // Poster Selection
    document.getElementById('posterInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const img = document.getElementById('stageBgImage');
      img.src = URL.createObjectURL(file);
      img.classList.remove('hidden');
    });

    // Brand Logo
    document.getElementById('brandNameInput').addEventListener('input', (e) => {
      document.getElementById('logoText').textContent = e.target.value.trim() || 'SK ProKH';
    });

    // Animation Buttons
    document.querySelectorAll('.anim-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        state.animation = btn.dataset.anim;
        document.querySelectorAll('.anim-chip').forEach(b => {
          b.className = b.dataset.anim === 'karaoke'
            ? 'anim-chip col-span-2 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300'
            : 'anim-chip py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300';
        });
        btn.className = btn.dataset.anim === 'karaoke'
          ? 'anim-chip col-span-2 py-1.5 rounded-lg text-xs font-semibold bg-pink-500 text-white'
          : 'anim-chip py-1.5 rounded-lg text-xs font-semibold bg-pink-500 text-white';
        applySubtitleStyle();
      });
    });

    // Font Size & BG Opacity
    document.getElementById('fontSizeRange').addEventListener('input', (e) => {
      state.fontSize = Number(e.target.value);
      document.getElementById('fontSizeVal').textContent = state.fontSize + 'px';
      applySubtitleStyle();
    });

    document.getElementById('bgOpacityRange').addEventListener('input', (e) => {
      state.bgOpacity = Number(e.target.value);
      document.getElementById('bgOpacityVal').textContent = state.bgOpacity + '%';
      document.getElementById('opacityLabel').textContent = 'BG: ' + state.bgOpacity + '%';
      applySubtitleStyle();
    });

    // Resolution Buttons
    document.querySelectorAll('.res-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.resolution = btn.dataset.res;
        document.querySelectorAll('.res-btn').forEach(b => {
          b.className = 'res-btn py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300';
        });
        btn.className = 'res-btn py-2 rounded-xl text-xs font-bold bg-emerald-500 text-slate-950';
        document.getElementById('previewResLabel').textContent = state.resolution;
        document.getElementById('exportSummary').textContent = state.resolution + ' • Subtitle + Logo';
      });
    });

    function toggleBlur() {
      state.blurEnabled = !state.blurEnabled;
      document.getElementById('blurZone').classList.toggle('hidden', !state.blurEnabled);
    }

    function applySubtitleStyle() {
      const el = document.getElementById('subtitlePreview');
      el.className = 'inline-block max-w-full px-3 py-1.5 rounded-lg font-bold leading-snug transition-all';
      if (state.animation === 'pop') el.classList.add('sub-pop');
      if (state.animation === 'bounce') el.classList.add('sub-bounce');
      if (state.animation === 'fade') el.classList.add('sub-fade');
      if (state.animation === 'slide') el.classList.add('sub-slide');
      if (state.animation === 'karaoke') {
        el.classList.add('sub-pop');
        el.style.color = '#fde047';
      } else {
        el.style.color = '#ffffff';
      }
      el.style.fontSize = state.fontSize + 'px';
      el.style.backgroundColor = `rgba(0, 0, 0, ${(state.bgOpacity / 100).toFixed(2)})`;
      document.getElementById('animNameLabel').textContent = 'Anim: ' + state.animation.toUpperCase();
    }

    function generateSampleKhmerSubs() {
      const lines = document.getElementById('rawLinesInput').value
        .split('\n')
        .map(l => l.trim())
        .filter(Boolean);
      if (!lines.length) return;

      const sampleTranslations = [
        'សួស្តី! ស្វាគមន៍មកកាន់រឿងថ្ងៃនេះ',
        'តោះយើងមើលរួមគ្នា ថាតើមានអ្វីកើតឡើង',
        'ពិតជាអស្ចារ្យណាស់ កុំភ្លេចតាមដានបន្ត!',
        'ឈុតនេះកាន់តែជក់ចិត្តថែមទៀតហើយ'
      ];

      state.subtitles = lines.map((line, idx) => {
        const s = idx * 3 + 1;
        const e = s + 2.8;
        return {
          start: `00:00:${String(s).padStart(2, '0')},000`,
          end: `00:00:${String(Math.floor(e)).padStart(2, '0')},500`,
          km: sampleTranslations[idx % sampleTranslations.length] + ` (${line.slice(0, 12)})`
        };
      });
      renderSubtitles();
      document.getElementById('subtitlePreview').textContent = state.subtitles[0].km;
    }

    function renderSubtitles() {
      const container = document.getElementById('subtitleList');
      document.getElementById('segCount').textContent = state.subtitles.length + ' ឃ្លា';
      container.innerHTML = '';
      state.subtitles.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'p-2.5 rounded-xl bg-slate-900/90 border border-white/10 space-y-1.5';
        row.innerHTML = `
          <div class="flex items-center justify-between text-[11px] text-slate-400">
            <span>#${index + 1} • ${item.start} → ${item.end}</span>
            <button class="text-cyan-300 font-semibold" onclick="previewLine(${index})">មើលលើវីដេអូ</button>
          </div>
          <input type="text" value="${item.km.replace(/"/g, '&quot;')}" onchange="updateLine(${index}, this.value)" class="w-full bg-slate-950 border border-white/10 rounded-lg px-2.5 py-1.5 text-xs text-white" />
        `;
        container.appendChild(row);
      });
    }

    function previewLine(idx) {
      document.getElementById('subtitlePreview').textContent = state.subtitles[idx].km;
      applySubtitleStyle();
    }

    function updateLine(idx, val) {
      state.subtitles[idx].km = val;
      document.getElementById('subtitlePreview').textContent = val;
    }

    function addEpisode() {
      if (state.episodes.length >= 10) return;
      const nextNum = state.episodes.length + 1;
      state.episodes.push({
        ep: nextNum,
        title: `ភាគទី ${nextNum} — សាច់រឿងបន្ត`,
        voice: 'សំឡេងខ្មែរធម្មជាតិ (Khmer)',
        status: 'រង់ចាំ Dub'
      });
      renderEpisodes();
    }

    function renderEpisodes() {
      const box = document.getElementById('episodeList');
      box.innerHTML = '';
      state.episodes.forEach(ep => {
        const card = document.createElement('div');
        card.className = 'p-3.5 rounded-xl bg-slate-900/90 border border-white/10 flex flex-col justify-between gap-2';
        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold text-amber-300">${ep.title}</span>
              <span class="text-[11px] px-2 py-0.5 rounded-full bg-white/10 text-slate-200">${ep.status}</span>
            </div>
            <div class="text-xs text-slate-400 mt-1">${ep.voice}</div>
          </div>
          <button onclick="selectEpisode(${ep.ep})" class="w-full py-1.5 rounded-lg bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-xs font-bold transition">
            ជ្រើសរើសភាគនេះ
          </button>
        `;
        box.appendChild(card);
      });
    }

    function selectEpisode(epNum) {
      state.activeEp = epNum;
      document.getElementById('epIndicator').textContent = `ភាគទី ${epNum}`;
    }

    function detectPlatform(url) {
      const u = url.toLowerCase();
      if (u.includes('douyin')) return 'Douyin';
      if (u.includes('tiktok')) return 'TikTok';
      if (u.includes('kuaishou')) return 'Kuaishou';
      if (u.includes('instagram')) return 'Instagram';
      if (u.includes('pinterest')) return 'Pinterest';
      if (u.includes('x.com') || u.includes('twitter')) return 'X';
      return 'Video Link';
    }

    function addLinkJob() {
      const input = document.getElementById('linkInput');
      const url = input.value.trim();
      if (!url) return;
      state.links.unshift({
        url,
        platform: detectPlatform(url),
        noWm: document.getElementById('optNoWatermark').checked,
        dub: document.getElementById('optDubAudio').checked
      });
      input.value = '';
      renderLinks();
    }

    function renderLinks() {
      const box = document.getElementById('linkQueueList');
      box.innerHTML = '';
      state.links.forEach((item, i) => {
        const div = document.createElement('div');
        div.className = 'p-3 rounded-xl bg-slate-900/90 border border-white/10 flex flex-wrap items-center justify-between gap-2 text-xs';
        div.innerHTML = `
          <div class="min-w-0 flex-1">
            <span class="px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-300 font-bold mr-2">${item.platform}</span>
            <span class="text-slate-200 break-all">${item.url}</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-[11px] text-emerald-300">${item.noWm ? 'No-WM' : 'Standard'} • ${item.dub ? 'Dub' : 'Sub'}</span>
            <button onclick="removeLink(${i})" class="px-2 py-1 rounded bg-rose-500/20 text-rose-300 font-semibold">លុប</button>
          </div>
        `;
        box.appendChild(div);
      });
    }

    function removeLink(i) {
      state.links.splice(i, 1);
      renderLinks();
    }

    function exportSrtFile() {
      const srtContent = state.subtitles.map((s, idx) =>
        `${idx + 1}\n${s.start} --> ${s.end}\n${s.km}\n`
      ).join('\n');
      const blob = new Blob([srtContent], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `SK_ProKH_Ep${state.activeEp}.srt`;
      a.click();
    }

    function exportProjectJson() {
      const payload = {
        brand: document.getElementById('brandNameInput').value || 'SK ProKH',
        resolution: state.resolution,
        animation: state.animation,
        fontSize: state.fontSize,
        bgOpacity: state.bgOpacity,
        blurEnabled: state.blurEnabled,
        activeEp: state.activeEp,
        subtitles: state.subtitles,
        episodes: state.episodes,
        links: state.links
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `SK_ProKH_Project.json`;
      a.click();
    }

    function triggerExportCheck() {
      document.getElementById('exportStatusMsg').textContent =
        `បានរៀបចំកញ្ចប់ ${state.resolution} (ចលនា ${state.animation.toUpperCase()}, ភាគទី ${state.activeEp}) រួចរាល់ — អ្នកអាចទាញយក .SRT / .JSON ឬភ្ជាប់ជាមួយ Python + FFmpeg ដើម្បី Render ជា MP4 ពិតប្រាកដ។`;
    }

    renderSubtitles();
    renderEpisodes();
    renderLinks();
    applySubtitleStyle();
  </script>
</body>
</html>
