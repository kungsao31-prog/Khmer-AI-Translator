
<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khmer AI Translator</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  padding: 15px;
}
.container {
  max-width: 500px;
  margin: auto;
  background: #1e293b;
  padding: 20px;
  border-radius: 15px;
}
h2 {text-align:center;color:#38bdf8}
label {display:block;margin-top:15px}
textarea,input,button {
  width:100%;
  box-sizing:border-box;
  padding:12px;
  margin-top:8px;
  border-radius:8px;
  border:0;
  font-size:16px;
}
textarea {height:110px}
button {
  background:#0284c7;
  color:white;
  font-weight:bold;
  margin-top:15px;
}
video {width:100%;margin-top:15px;border-radius:10px}
.note {color:#fbbf24;font-size:13px}
</style>
</head>
<body>
<div class="container">
<h2>🇰🇭 Khmer AI Translator</h2>
<p style="text-align:center">បកប្រែវីដេអូជាភាសាខ្មែរ</p>

<label>📁 ជ្រើសរើសវីដេអូ</label>
<input type="file" id="videoFile" accept="video/*">

<video id="player" controls hidden></video>

<label>🇨🇳 អត្ថបទដើម (ភាសាចិន)</label>
<textarea id="chinese" placeholder="បញ្ចូលអត្ថបទចិននៅទីនេះ..."></textarea>

<label>🇰🇭 អត្ថបទបកប្រែ (ភាសាខ្មែរ)</label>
<textarea id="khmer" placeholder="បញ្ចូលអត្ថបទខ្មែរនៅទីនេះ..."></textarea>

<label>⏱ រយៈពេលក្នុងមួយចំណងជើង (វិនាទី)</label>
<input type="number" id="duration" value="5" min="1">

<button onclick="makeSRT()">📥 បង្កើតឯកសារ Khmer SRT</button>

<p id="status" class="note"></p>

<hr>
<p style="text-align:center">Khmer AI Translator 🇰🇭</p>
</div>

<script>
const fileInput = document.getElementById("videoFile");
const player = document.getElementById("player");

fileInput.addEventListener("change", function() {
  if(this.files[0]) {
    player.src = URL.createObjectURL(this.files[0]);
    player.hidden = false;
  }
});

function timestamp(seconds) {
  let h = Math.floor(seconds / 3600);
  let m = Math.floor((seconds % 3600) / 60);
  let s = Math.floor(seconds % 60);
  return String(h).padStart(2,'0') + ":" +
         String(m).padStart(2,'0') + ":" +
         String(s).padStart(2,'0') + ",000";
}

function makeSRT() {
  const text = document.getElementById("khmer").value.trim();
  const duration = Number(document.getElementById("duration").value);

  if(!text) {
    alert("សូមបញ្ចូលអត្ថបទភាសាខ្មែរ!");
    return;
  }

  if(!Number.isFinite(duration) || duration < 1) {
    alert("សូមបញ្ចូលរយៈពេលឱ្យបានត្រឹមត្រូវ!");
    return;
  }

  const lines = text.split(/\r?\n/).filter(x => x.trim());
  let srt = "";

  lines.forEach((line, i) => {
    srt += (i + 1) + "\n";
    srt += timestamp(i * duration) + " --> ";
    srt += timestamp((i + 1) * duration) + "\n";
    srt += line.trim() + "\n\n";
  });

  const blob = new Blob(["\uFEFF" + srt], {
    type: "text/plain;charset=utf-8"
  });

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "Khmer-Subtitles.srt";
  a.click();
  URL.revokeObjectURL(url);

  document.getElementById("status").textContent =
    "បានបង្កើតឯកសារ SRT រួចរាល់!";
}
</script>
</body>
</html>
