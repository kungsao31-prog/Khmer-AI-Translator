services:
  - type: web
    name: Khmer-AI-Translator
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FFMPEG_PATH
        value: /usr/bin/ffmpeg
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_VIDEO_MODEL
        value: gemini-3.8-flash
      - key: MAX_VIDEO_MB
        value: 200
      - key: MAX_SERIES_TOTAL_MB
        value: 200
      - key: EDGE_TTS_CONCURRENCY
        value: 1
      - key: NODE_OPTIONS
        value: --max-old-space-size=256
