services:
  - type: web
    name: khmer-ai-translator-pro
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_TTS_MODEL
        value: gemini-2.5-flash-preview-tts
      - key: MAX_VIDEO_MB
        value: 200
