services:
  - type: web
    name: Khmer-AI-Translator
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FFMPEG_PATH
        value: /usr/bin/ffmpeg
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: REFRESH_TOKEN_DAYS
        value: 30
      - key: ENABLE_REGISTRATION
        value: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_TTS_MODEL
        value: gemini-2.5-flash-preview-tts
      - key: MAX_VIDEO_MB
        value: 200
      - key: MAX_SERIES_TOTAL_MB
        value: 200
      - key: EDGE_TTS_CONCURRENCY
        value: 1
      - key: NODE_OPTIONS
        value: --max-old-space-size=256
